<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoulViet AI - Hành Trình Bản Địa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .prose h1,
        .prose h2,
        .prose h3 {
            color: #1a202c;
            font-weight: bold;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .prose p {
            margin-bottom: 1rem;
            line-height: 1.7;
        }

        .prose ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .loading-dots:after {
            content: ' .';
            animation: dots 1.5s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: ' .';
            }

            40% {
                content: ' ..';
            }

            60% {
                content: ' ...';
            }

            80%,
            100% {
                content: '';
            }
        }
    </style>
</head>

<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Header -->
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-map-location-dot text-orange-500 text-2xl"></i>
                <span class="text-xl font-bold text-slate-800">SoulViet <span class="text-orange-500">AI</span></span>
            </div>
            <div class="text-sm text-slate-500">Trợ lý du lịch thông minh</div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Form Nhập Liệu -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
                    <h2 class="text-lg font-semibold mb-6 flex items-center">
                        <i class="fa-solid fa-sliders mr-2 text-orange-500"></i> Tùy chỉnh chuyến đi
                    </h2>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Số ngày đi</label>
                            <input type="number" id="duration" value="2" min="1" max="5"
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Ngân sách dự kiến (VNĐ)</label>
                            <input type="number" id="budget" value="2000000" step="500000"
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none transition">
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Phong cách trải nghiệm</label>
                            <select id="vibe"
                                class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none transition">
                                <option value="culture">Đậm văn hóa & Bản địa</option>
                                <option value="chill">Chữa lành & Yên bình</option>
                                <option value="food">Ẩm thực & Đặc sản</option>
                                <option value="adventure">Năng động & Phiêu lưu</option>
                                <option value="creative">Sáng tạo & Truyền cảm hứng</option>
                            </select>
                        </div>

                        <button onclick="planTrip()" id="btn-submit"
                            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-orange-200 flex items-center justify-center">
                            <span>Lên kế hoạch ngay</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Kết Quả -->
            <div class="lg:col-span-2">
                <!-- Màn hình chờ -->
                <div id="loading"
                    class="hidden bg-white rounded-2xl shadow-sm p-12 text-center border border-slate-100">
                    <div class="inline-block animate-bounce mb-4">
                        <i class="fa-solid fa-paper-plane text-4xl text-orange-500"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-slate-800 loading-dots">SoulViet AI đang thiết kế lịch trình
                    </h3>
                    <p class="text-slate-500 mt-2">Chúng tôi đang tìm kiếm những địa điểm phù hợp nhất với bạn...</p>
                </div>

                <!-- Nội dung lịch trình -->
                <div id="result" class="hidden space-y-6">
                    <!-- Tóm tắt nhanh -->
                    <div class="bg-white rounded-2xl shadow-sm p-6 border border-slate-100">
                        <h3 class="font-bold text-slate-800 mb-4 flex items-center">
                            <i class="fa-solid fa-list-check mr-2 text-green-500"></i> Tóm tắt lộ trình
                        </h3>
                        <div id="summary-list" class="space-y-3">
                            <!-- JS chèn vào đây -->
                        </div>
                    </div>

                    <!-- Nội dung AI -->
                    <div class="bg-white rounded-2xl shadow-sm p-8 border border-slate-100">
                        <div id="ai-content" class="prose max-w-none text-slate-700">
                            <!-- JS chèn vào đây -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function planTrip() {
            const btn = document.getElementById('btn-submit');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');

            // Lấy dữ liệu
            const data = {
                duration: document.getElementById('duration').value,
                budget: document.getElementById('budget').value,
                vibe: document.getElementById('vibe').value
            };

            // Hiển thị trạng thái loading
            btn.disabled = true;
            btn.classList.add('opacity-50');
            loading.classList.remove('hidden');
            result.classList.add('hidden');

            try {
                const response = await fetch('http://127.0.0.1:8000/plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const resData = await response.json();
                const payload = resData.data;

                // Hiển thị tóm tắt
                const summaryList = document.getElementById('summary-list');
                summaryList.innerHTML = '';
                payload.itinerary_summary.forEach(day => {
                    summaryList.innerHTML += `
                        <div class="flex items-start space-x-3 p-3 bg-slate-50 rounded-lg">
                            <span class="bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded">Ngày ${day.day}</span>
                            <p class="text-sm text-slate-700 font-medium">${day.places.join(' → ')}</p>
                        </div>
                    `;
                });

                // Hiển thị AI Content (Render Markdown)
                document.getElementById('ai-content').innerHTML = marked.parse(payload.ai_suggestion);

                // Hiện kết quả
                result.classList.remove('hidden');
            } catch (error) {
                alert('Có lỗi xảy ra khi kết nối với Server!');
                console.error(error);
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }
        }
    </script>
</body>

</html>
