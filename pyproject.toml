[project]
name = "soulviet-workspace"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/contracts", "packages/compiler", "apps/cli"]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
