[project]
name = "soulviet-cli"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["soulviet-compiler"]

[project.scripts]
soulviet-compile-fixture = "soulviet_cli.main:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulviet_cli"]

[tool.uv.sources]
soulviet-compiler = { workspace = true }
