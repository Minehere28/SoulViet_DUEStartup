[project]
name = "soulviet-compiler"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = ["soulviet-contracts"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soulviet_compiler"]

[tool.uv.sources]
soulviet-contracts = { workspace = true }
